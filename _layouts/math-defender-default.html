<!doctype html>
<html lang="{{ page.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }} | Math Defender</title>
  <meta name="description" content="{{ page.description | default: page.summary | escape }}">
  <link rel="stylesheet" href="/games/math-defender/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/">Five Rocks Games</a>
    <div class="header-tools">
      <div class="language-switch" aria-label="Language">
        {% if page.lang == 'en' %}
          <a href="{{ page.translation_url }}" hreflang="ko">KR</a><span class="active" aria-current="true">EN</span>
        {% else %}
          <span class="active" aria-current="true">KR</span><a href="{{ page.translation_url }}" hreflang="en">EN</a>
        {% endif %}
      </div>
    </div>
    <nav>
      {% if page.lang == 'en' %}
        <a href="/games/math-defender/en/">Math Defender</a>
        <a href="/games/math-defender/en/play/">Play</a>
        <a href="/games/math-defender/en/journals/">Journal</a>
      {% else %}
        <a href="/games/math-defender/">Math Defender</a>
        <a href="/games/math-defender/play/">Play</a>
        <a href="/games/math-defender/journals/">개발 일지</a>
      {% endif %}
    </nav>
  </div>
</header>
{{ content }}
<footer><div class="wrap">© Five Rocks Games · Math Defender</div></footer>
</body>
</html>
